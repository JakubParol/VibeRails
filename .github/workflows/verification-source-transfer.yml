name: Verification Source Transfer
on:
  push:
    branches: [codex/refactor-08-09-verification]
    paths: [.github/workflows/verification-source-transfer.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 853a7bc299009baf9e899980e89e49907d0f8c97
      - name: Export tracked source and commit identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/source-export"
          git archive --format=tar HEAD > "$RUNNER_TEMP/source-export/current.tar"
          git cat-file commit HEAD > "$RUNNER_TEMP/source-export/current.commit"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/source-export/current.tree"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-base-853a7bc
          path: ${{ runner.temp }}/source-export/
          retention-days: 1
