name: PR Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Record tested revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validator regression tests
        id: tests
        run: node --test scripts/tests/validate.test.mjs

      - name: Adoption and migration regressions
        id: adoption
        run: node --test scripts/tests/adoption.test.mjs scripts/tests/adoption-refresh.test.mjs scripts/tests/adoption-boundaries.test.mjs scripts/tests/adoption-records.test.mjs

      - name: POSIX skill installer regressions
        id: installer
        run: node --test scripts/tests/install-skills.test.mjs

      - name: Pinned controlled pilot
        id: pilot
        run: |
          baseline=a60dca9638bf12cd84244aedcf5fc8d2a9734baa
          candidate=d92f6fa34d1809997c2d9629d81ca382d00e9ff2
          git fetch --no-tags --depth=1 origin "$baseline" "$candidate"
          pilot_root=$(mktemp -d "$RUNNER_TEMP/viberails-pilot.XXXXXX")
          trap 'rm -rf "$pilot_root"' EXIT
          mkdir "$pilot_root/baseline" "$pilot_root/candidate"
          git archive "$baseline" | tar -x -C "$pilot_root/baseline"
          git archive "$candidate" | tar -x -C "$pilot_root/candidate"
          printf 'Pilot baseline: %s\nPilot candidate: %s\n' "$baseline" "$candidate"
          VIBERAILS_BASELINE_ROOT="$pilot_root/baseline" \
          VIBERAILS_CANDIDATE_ROOT="$pilot_root/candidate" \
            node --test scripts/tests/pilot.test.mjs

      - name: Full documentation and skill validation
        id: validation
        run: node scripts/validate.mjs --all

      - name: Architecture example behavior
        id: examples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("docs/templates/architecture-variants.md").read_text()
          recipe = re.search(r"```bash\npython3 - <<'PY'\n(.*?)\nPY\n```", text, re.S)
          if recipe is None:
              raise SystemExit("Architecture behavior recipe is missing")
          exec(compile(recipe.group(1), "architecture-behavior-recipe", "exec"))
          PY

      - name: Verification summary
        if: always()
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_REVISION: ${{ steps.revision.outputs.sha || 'unavailable' }}
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          NODE_RESULT: ${{ steps.node.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          ADOPTION_RESULT: ${{ steps.adoption.outcome }}
          INSTALLER_RESULT: ${{ steps.installer.outcome }}
          PILOT_RESULT: ${{ steps.pilot.outcome }}
          VALIDATION_RESULT: ${{ steps.validation.outcome }}
          EXAMPLE_RESULT: ${{ steps.examples.outcome }}
        run: |
          {
            echo '# PR Verification'
            printf 'Source revision: `%s`\n\n' "$SOURCE_REVISION"
            printf 'Tested revision: `%s`\n\n' "$TESTED_REVISION"
            echo '| Check | Outcome |'
            echo '|---|---|'
            printf '| Checkout | %s |\n' "$CHECKOUT_RESULT"
            printf '| Node setup | %s |\n' "$NODE_RESULT"
            printf '| Validator regressions | %s |\n' "$TEST_RESULT"
            printf '| Adoption/update regressions | %s |\n' "$ADOPTION_RESULT"
            printf '| POSIX installer regressions | %s |\n' "$INSTALLER_RESULT"
            printf '| Pinned controlled pilot | %s |\n' "$PILOT_RESULT"
            printf '| Full documentation/skill gate | %s |\n' "$VALIDATION_RESULT"
            printf '| Architecture examples | %s |\n' "$EXAMPLE_RESULT"
            echo
            echo 'Skipped, cancelled, missing and failed checks are not passed verification.'
            echo 'Open the failed step for details. No PowerShell, live HTTP or database validation is claimed.'
          } >> "$GITHUB_STEP_SUMMARY"

  adoption-portability:
    name: Adoption portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record environment and revision
        run: |
          git rev-parse HEAD
          node --version
          python3 --version
      - name: Adoption, refresh and instruction-boundary regressions
        run: node --test scripts/tests/adoption.test.mjs scripts/tests/adoption-refresh.test.mjs scripts/tests/adoption-boundaries.test.mjs scripts/tests/adoption-records.test.mjs
      - name: POSIX skill installer regressions (macOS only)
        if: runner.os == 'macOS'
        run: node --test scripts/tests/install-skills.test.mjs
