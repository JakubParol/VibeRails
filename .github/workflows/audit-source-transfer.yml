name: Audit Source Transfer
on:
  push:
    branches: [codex/refactor-audit-00-09-fixes]
    paths: [.github/workflows/audit-source-transfer.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ffb80cb224b924aaea0d5baa3d02b53d03459e0b
          persist-credentials: false
      - name: Export tracked pinned source only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit-source"
          git archive HEAD > "$RUNNER_TEMP/audit-source/current.tar"
          git cat-file commit HEAD > "$RUNNER_TEMP/audit-source/current.commit"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/audit-source/current.tree"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-base-ffb80cb
          path: ${{ runner.temp }}/audit-source/
          retention-days: 1
